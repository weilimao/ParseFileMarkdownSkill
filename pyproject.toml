[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markitdown-skill"
version = "1.0.0"
description = "A professional AI Document Parser Skill wrapping Microsoft MarkItDown"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "markitdown[all]>=0.0.1a4",
    "openai",
    "mcp"
]

[project.scripts]
markitdown-skill = "markitdown_skill.cli:main"
markitdown-mcp = "markitdown_skill.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markitdown_skill*"]
